name: "Distribution: [For manual use] Build and release"

permissions: {}

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ""
      is-release:
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        type: string
        default: ""
      is-release:
        description: "Create release page"
        type: boolean
        default: true

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on:
      - ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      REF_VERSION: ${{ github.ref_name }}
      INPUTS_VERSION: ${{ inputs.version }}
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          package-manager-cache: false
          cache: "pnpm"

      - name: Install dependencies
        run: |
          set -ex
          pnpm install --frozen-lockfile

      - name: "Prebuild: lint"
        run: |
          set -ex
          pnpm run lint

      - name: "Prebuild: test"
        run: |
          set -ex
          pnpm run test

      - name: Build using pnpm
        run: |
          set -ex
          pnpm run build

      - name: Set the version
        id: set_version
        run: |
          set -ex
          VERSION_REG='^[0-9]+\.[0-9]+\.[0-9]+$' # major.minor.patch
          if [ -n "${INPUTS_VERSION}" ]; then
            V="${INPUTS_VERSION}"
          elif [[ (-n "${REF_VERSION}") && ("${REF_VERSION}" =~ ${VERSION_REG}) ]]; then
            V="${REF_VERSION}"
          else
            V=$(git describe --tags --always --dirty)
          fi
          echo "version=${V}" >> "${GITHUB_OUTPUT}"

      - name: Upload artifact
        if: ${{ inputs.is-release }}
        env:
          VERSION: ${{ steps.set_version.outputs.version }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tab-clipper-${{ env.VERSION }}
          path: ./dist/

  release:
    if: ${{ inputs.is-release }}
    needs:
      - build
    runs-on:
      - ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: download
        with:
          name: tab-clipper-${{ env.VERSION }}
          path: ./tab-clipper-${{ env.VERSION }}

      - name: Create zip archive
        run: |
          set -ex
          cd "./tab-clipper-${VERSION}/"
          zip -r "../tab-clipper-${VERSION}.zip" .

      - name: Create release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          gh release create "${VERSION}" --title "TabClipper ${VERSION}" --generate-notes
          gh release upload "${VERSION}" "./tab-clipper-${VERSION}.zip"
